# ============================================================
# CalisTrack — Supabase project config
# ใช้กับ GitHub Integration: Supabase อ่าน schema จาก supabase/migrations/
# แล้ว apply ให้อัตโนมัติ (แนวทาง B — repo เป็นต้นทางของโครงสร้างตาราง)
# ============================================================

project_id = "vzkuofbluosaweqxvvfe"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[analytics]
enabled = false
port = 54327
